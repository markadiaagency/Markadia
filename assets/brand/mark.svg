<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Markadia">
  <title>Markadia</title>
  <!-- The mark already in use on markadiawave.com: a square with the lower-right
       corner cut, drawn as a frame. The inner counter is transparent (even-odd),
       so it sits on light and dark alike — the inlined favicon it replaces had a
       hard-coded dark fill there and only worked on the dark theme.
       Swap this one file to change the mark everywhere. -->
  <path fill="#062FF8" fill-rule="evenodd"
        d="M0 0h64v44.8L44.8 64H0Z M8 8v48h33.7L56 41.7V8Z"/>
</svg>
